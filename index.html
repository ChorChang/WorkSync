<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作进度同步</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- FontAwesome 图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    [v-cloak] { display: none; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #fcfcfc;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen pb-12" id="app" v-cloak>

  <!-- 顶部标题与新建按钮 -->
  <header class="max-w-4xl mx-auto pt-8 px-4 flex justify-between items-center mb-6">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-slate-800 rounded-lg flex items-center justify-center text-white">
        <i class="fa-regular fa-clipboard text-lg"></i>
      </div>
      <h1 class="text-xl font-bold text-slate-900">工作进度同步</h1>
    </div>
    <button @click="openCreateModal" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition-all shadow flex items-center gap-1.5">
      <i class="fa-solid fa-plus text-xs"></i> 新建工作项
    </button>
  </header>

  <!-- 主内容区 -->
  <main class="max-w-4xl mx-auto px-4">

    <!-- 过滤器选项卡 -->
    <div class="flex items-center gap-6 mb-4 text-sm font-medium">
      <button @click="activeTab = 'active'" :class="activeTab === 'active' ? 'text-amber-600 font-bold' : 'text-slate-400 hover:text-slate-600'" class="flex items-center gap-1.5 py-1">
        <i class="fa-regular fa-folder-open text-amber-500"></i> 进行中 
        <span class="bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full text-xs font-normal">{{ activeProjects.length }}</span>
      </button>
      <button @click="activeTab = 'completed'" :class="activeTab === 'completed' ? 'text-emerald-600 font-bold' : 'text-slate-400 hover:text-slate-600'" class="flex items-center gap-1.5 py-1">
        <i class="fa-regular fa-circle-check text-emerald-500"></i> 已完成
        <span class="bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full text-xs font-normal">{{ completedProjects.length }}</span>
      </button>
    </div>

    <!-- 工作项列表 -->
    <div class="space-y-4">

      <!-- 空状态 -->
      <div v-if="currentList.length === 0" class="text-center py-16 bg-white rounded-2xl border border-slate-100 shadow-sm text-slate-400">
        <i class="fa-regular fa-folder-open text-4xl mb-2 text-slate-300"></i>
        <p>暂无数据</p>
      </div>

      <!-- 单个工作项卡片 -->
      <div v-for="item in currentList" :key="item.id" class="bg-white rounded-2xl border border-amber-200/60 shadow-sm p-5 transition-all">
        
        <!-- 头部：折叠箭头、标题、进度条、百分比、删除 -->
        <div class="flex items-center gap-3 mb-3">
          <button @click="item.isCollapsed = !item.isCollapsed" class="text-slate-400 hover:text-slate-600 text-xs">
            <i class="fa-solid" :class="item.isCollapsed ? 'fa-chevron-right' : 'fa-chevron-down'"></i>
          </button>
          
          <h2 class="text-base font-bold text-slate-800 flex-1">{{ item.title }}</h2>

          <button @click="deleteWorkItem(item.id)" class="text-slate-300 hover:text-rose-500 text-sm transition-colors" title="删除工作项">
            <i class="fa-regular fa-trash-can"></i>
          </button>
        </div>

        <!-- 进度条 -->
        <div class="flex items-center gap-4 mb-4">
          <div class="flex-1 bg-slate-100 h-3 rounded-full overflow-hidden">
            <div class="h-full bg-amber-500 rounded-full transition-all duration-300" :style="{ width: calculateProgress(item) + '%' }"></div>
          </div>
          <span class="text-xs font-bold font-mono text-amber-600 min-w-[35px] text-right">{{ calculateProgress(item) }}%</span>
        </div>

        <!-- 子任务列表区域 (展开状态) -->
        <div v-show="!item.isCollapsed" class="space-y-2.5 pt-2">
          
          <!-- 单个子任务胶囊 -->
          <div v-for="(sub, sIdx) in item.subtasks" :key="sIdx" 
               :class="[
                 'flex items-center justify-between px-3.5 py-2.5 rounded-xl border transition-all text-sm',
                 sub.status === 'done' ? 'bg-emerald-50/50 border-emerald-200 text-slate-400' :
                 sub.status === 'doing' ? 'bg-amber-50/50 border-amber-300 text-slate-700' :
                 'bg-slate-50/50 border-slate-200 text-slate-700'
               ]">
            
            <div class="flex items-center gap-3 flex-1">
              <!-- 核心：三段式点击按钮 (未开始 -> 进行中 -> 已完成 -> 未开始) -->
              <button @click="toggleSubtaskStatus(item, sub)" class="w-5 h-5 rounded-full flex items-center justify-center flex-shrink-0 transition-transform active:scale-95">
                <!-- 已完成: 绿底白勾 -->
                <div v-if="sub.status === 'done'" class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px]">
                  <i class="fa-solid fa-check"></i>
                </div>
                <!-- 进行中: 橙底白横杠 -->
                <div v-else-if="sub.status === 'doing'" class="w-5 h-5 rounded-full bg-amber-500 text-white flex items-center justify-center text-[10px]">
                  <i class="fa-solid fa-minus"></i>
                </div>
                <!-- 未开始: 灰圈 -->
                <div v-else class="w-5 h-5 rounded-full border-2 border-slate-300 hover:border-slate-400"></div>
              </button>

              <!-- 子任务文本输入 -->
              <input type="text" v-model="sub.text" placeholder="任务内容..." class="bg-transparent focus:outline-none flex-1 text-sm" :class="{ 'line-through text-slate-400': sub.status === 'done' }">
            </div>

            <!-- 右侧：权重与编辑/删除操作 -->
            <div class="flex items-center gap-3">
              <!-- 权重百分比显示/修改 -->
              <div class="flex items-center text-xs text-slate-400 font-mono">
                <input type="number" v-model.number="sub.weight" @input="onSubtaskChange(item)" min="0" max="100" class="w-8 bg-transparent text-right focus:outline-none focus:text-amber-600">
                <span>%</span>
              </div>

              <!-- 编辑备注按钮 -->
              <button @click="sub.showNote = !sub.showNote" class="text-slate-300 hover:text-slate-500 text-xs" :class="{ 'text-amber-500': sub.note }">
                <i class="fa-solid fa-pencil"></i>
              </button>

              <!-- 删除子任务按钮 -->
              <button @click="removeSubtask(item, sIdx)" class="text-slate-300 hover:text-rose-400 text-xs">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>

            <!-- 展开的独立备注栏 -->
            <div v-if="sub.showNote" class="w-full pl-8 pr-2 pt-1 pb-1">
              <input type="text" v-model="sub.note" placeholder="添加备注..." class="w-full bg-white border border-slate-200 rounded-md px-2 py-1 text-xs text-slate-600 focus:outline-none focus:border-amber-400">
            </div>
          </div>

          <!-- 底部新增子任务栏 -->
          <div class="flex gap-2 pt-1">
            <div class="flex-1 border border-dashed border-slate-200 rounded-xl px-3 py-1.5 flex items-center gap-2 text-slate-400 bg-slate-50/30">
              <i class="fa-solid fa-plus text-xs"></i>
              <input type="text" v-model="item.newSubtaskTitle" @keyup.enter="addNewSubtask(item)" placeholder="添加新任务..." class="bg-transparent text-sm w-full focus:outline-none text-slate-700">
            </div>
            <button @click="addNewSubtask(item)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-1.5 rounded-xl text-xs font-medium transition-colors">
              添加
            </button>
          </div>

        </div>

      </div>

    </div>

  </main>

  <!-- 新建工作项弹窗 -->
  <div v-if="showModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="text-base font-bold text-slate-800">新建工作项</h3>
        <button @click="showModal = false" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-slate-500 text-xs font-semibold mb-1">工作项名称</label>
          <input type="text" v-model="newItem.title" placeholder="例如：test" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-slate-700 focus:outline-none focus:border-amber-500">
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button @click="showModal = false" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-medium text-slate-600">取消</button>
        <button @click="createWorkItem" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 rounded-xl text-xs font-medium text-white">创建</button>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed, watch, onMounted } = Vue;

    createApp({
      setup() {
        const activeTab = ref('active');
        const showModal = ref(false);
        const projects = ref([]);

        const newItem = ref({ title: '' });

        onMounted(() => {
          const saved = localStorage.getItem('worksync_data');
          if (saved) {
            try { projects.value = JSON.parse(saved); } catch (e) { projects.value = []; }
          } else {
            // 初始化参考图的数据
            projects.value = [
              {
                id: Date.now(),
                title: 'test',
                status: 'in_progress',
                isCollapsed: false,
                newSubtaskTitle: '',
                subtasks: [
                  { text: 'a', status: 'done', weight: 20, showNote: false, note: '' },
                  { text: 's', status: 'done', weight: 20, showNote: false, note: '' },
                  { text: 'd', status: 'doing', weight: 20, showNote: false, note: '' },
                  { text: 'f', status: 'todo', weight: 20, showNote: false, note: '' },
                  { text: 'g', status: 'todo', weight: 20, showNote: false, note: '' }
                ]
              }
            ];
          }
        });

        watch(projects, (newVal) => {
          localStorage.setItem('worksync_data', JSON.stringify(newVal));
        }, { deep: true });

        // 切换子任务状态：todo -> doing -> done -> todo
        const toggleSubtaskStatus = (item, sub) => {
          if (sub.status === 'todo') {
            sub.status = 'doing';
          } else if (sub.status === 'doing') {
            sub.status = 'done';
          } else {
            sub.status = 'todo';
          }
          onSubtaskChange(item);
        };

        // 计算总进度（done 算 100% 权重，doing 算 50% 权重）
        const calculateProgress = (item) => {
          if (!item.subtasks || item.subtasks.length === 0) return 0;
          
          let totalWeight = item.subtasks.reduce((acc, sub) => acc + (Number(sub.weight) || 0), 0);
          if (totalWeight === 0) return 0;

          let currentWeight = item.subtasks.reduce((acc, sub) => {
            if (sub.status === 'done') return acc + (Number(sub.weight) || 0);
            if (sub.status === 'doing') return acc + ((Number(sub.weight) || 0) * 0.5); // 进行中算一半进度
            return acc;
          }, 0);

          let progress = Math.round((currentWeight / totalWeight) * 100);
          return Math.min(100, Math.max(0, progress));
        };

        const onSubtaskChange = (item) => {
          const progress = calculateProgress(item);
          if (progress === 100) {
            item.status = 'done';
          } else {
            item.status = 'in_progress';
          }
        };

        const autoBalanceWeights = (item) => {
          if (!item.subtasks.length) return;
          const avg = Math.floor(100 / item.subtasks.length);
          const remainder = 100 - (avg * item.subtasks.length);

          item.subtasks.forEach((sub, i) => {
            sub.weight = i === 0 ? avg + remainder : avg;
          });
          onSubtaskChange(item);
        };

        const addNewSubtask = (item) => {
          if (!item.newSubtaskTitle || !item.newSubtaskTitle.trim()) return;
          item.subtasks.push({
            text: item.newSubtaskTitle.trim(),
            status: 'todo',
            weight: 0,
            showNote: false,
            note: ''
          });
          item.newSubtaskTitle = '';
          autoBalanceWeights(item);
        };

        const removeSubtask = (item, index) => {
          item.subtasks.splice(index, 1);
          autoBalanceWeights(item);
        };

        const activeProjects = computed(() => projects.value.filter(p => p.status !== 'done'));
        const completedProjects = computed(() => projects.value.filter(p => p.status === 'done'));
        const currentList = computed(() => activeTab.value === 'active' ? activeProjects.value : completedProjects.value);

        const openCreateModal = () => {
          newItem.value = { title: '' };
          showModal.value = true;
        };

        const createWorkItem = () => {
          if (!newItem.value.title.trim()) return;
          projects.value.unshift({
            id: Date.now(),
            title: newItem.value.title.trim(),
            status: 'in_progress',
            isCollapsed: false,
            newSubtaskTitle: '',
            subtasks: []
          });
          showModal.value = false;
        };

        const deleteWorkItem = (id) => {
          if (confirm('确定要删除这个工作项吗？')) {
            projects.value = projects.value.filter(p => p.id !== id);
          }
        };

        return {
          activeTab,
          showModal,
          newItem,
          activeProjects,
          completedProjects,
          currentList,
          openCreateModal,
          createWorkItem,
          deleteWorkItem,
          toggleSubtaskStatus,
          calculateProgress,
          onSubtaskChange,
          addNewSubtask,
          removeSubtask
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
